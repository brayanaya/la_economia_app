version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: la_economia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-la_economia_db}
      POSTGRES_USER: ${POSTGRES_USER:-la_economia_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-la_economia_pass_dev}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - la_economia_pgdata:/var/lib/postgresql/data/pgdata
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - la_economia_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: la_economia_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - la_economia_net
    volumes:
      - ./app:/code/app  # hot-reload en desarrollo local

volumes:
  la_economia_pgdata:
    name: la_economia_pgdata

networks:
  la_economia_net:
    name: la_economia_net
    driver: bridge
